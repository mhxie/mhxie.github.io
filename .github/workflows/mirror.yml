name: Daily Homepage Retrieval

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Node.js for markdownlint
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install markdownlint-cli
      run: npm install -g markdownlint-cli

    - name: Run script
      id: sync
      run: |
        if uv run sync.py; then
          echo "Script indicates changes were made"
          echo "content_changed=true" >> $GITHUB_OUTPUT
        else
          echo "Script indicates no changes were made"
        fi

    - name: Fix markdown linting issues
      if: steps.sync.outputs.content_changed == 'true'
      run: |
        if [ -f index.md ]; then
          markdownlint --fix index.md || true
        fi

    - name: Check for changes
      id: git_diff
      if: steps.sync.outputs.content_changed == 'true'
      run: |
        git diff --exit-code || echo "changes_detected=true" >> $GITHUB_OUTPUT

    - name: Commit and push changes
      if: steps.sync.outputs.content_changed == 'true' && steps.git_diff.outputs.changes_detected == 'true'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add index.md _layouts/default.html
        git commit -m "Last update on $(date -u '+%Y-%m-%d')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


